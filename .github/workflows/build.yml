name: build

# Runs the tests on every push. When a version tag such as v0.1.0 is pushed, it also builds wk1-converter.exe on a
# Windows runner and attaches it to a GitHub Release, so the program is built from the code in the repository.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --upgrade pip pyinstaller openpyxl
      - name: Test
        run: python test_wk1.py
      - name: Build the exe
        run: python -m PyInstaller --onefile --console --name wk1-converter --clean --noconfirm wk1.py
      - name: Smoke test the exe
        run: |
          python -c "import test_wk1; open('smoke.wk1', 'wb').write(test_wk1.sample())"
          .\dist\wk1-converter.exe smoke.wk1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Select-String -Path smoke.csv -Pattern 'Abbott' -Quiet)) { throw 'smoke.csv has no data' }
      - uses: actions/upload-artifact@v4
        with:
          name: wk1-converter-windows
          path: dist/wk1-converter.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/wk1-converter.exe
