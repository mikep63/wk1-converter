name: build

# Runs the tests on every push. When a version tag such as v0.1.0 is pushed, it also builds wk1-converter.exe on a
# Windows runner and attaches it to a GitHub Release, so the program is built from the code in the repository.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --upgrade pip pyinstaller openpyxl
      - name: Test
        run: python test_wk1.py
      - name: Build the exes
        run: |
          python -m PyInstaller --onefile --console --hidden-import wk1_app --name wk1-converter --clean --noconfirm wk1.py
          python -m PyInstaller --onefile --windowed --hidden-import wk1_app --name wk1-converter-gui --noconfirm wk1.py
      - name: Smoke test the exes
        run: |
          python -c "import test_wk1; open('smoke.wk1', 'wb').write(test_wk1.sample())"
          .\dist\wk1-converter.exe smoke.wk1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Select-String -Path smoke.csv -Pattern 'Abbott' -Quiet)) { throw 'smoke.csv has no data' }
          Remove-Item smoke.csv
          $p = Start-Process .\dist\wk1-converter-gui.exe -ArgumentList '--convert','--quiet','smoke.wk1' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          if (-not (Select-String -Path smoke.csv -Pattern 'Abbott' -Quiet)) { throw 'the gui exe wrote no data' }
          # the window itself: it opens the file (its title names the file) and keeps running until closed. A one-file exe starts a second
          # process that owns the window, so look for the title across the processes of that name.
          Start-Process .\dist\wk1-converter-gui.exe -ArgumentList 'smoke.wk1'
          Start-Sleep -Seconds 8
          $titles = @(Get-Process wk1-converter-gui | Where-Object { $_.MainWindowTitle } | ForEach-Object { $_.MainWindowTitle })
          Get-Process wk1-converter-gui -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not ($titles -like '*smoke.wk1*')) { throw ('the window did not open the file; titles: ' + ($titles -join ', ')) }
      - uses: actions/upload-artifact@v4
        with:
          name: wk1-converter-windows
          path: dist/*.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/wk1-converter.exe
            dist/wk1-converter-gui.exe
